name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture reproducibility metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          "repository=$env:GITHUB_REPOSITORY" | Set-Content evidence/metadata.txt
          "checkout_sha=$(git rev-parse HEAD)" | Add-Content evidence/metadata.txt
          "event_sha=$env:GITHUB_SHA" | Add-Content evidence/metadata.txt
          "pr_head_sha=${{ github.event.pull_request.head.sha || github.sha }}" | Add-Content evidence/metadata.txt
          "run_id=$env:GITHUB_RUN_ID" | Add-Content evidence/metadata.txt
          "runner=$env:RUNNER_OS" | Add-Content evidence/metadata.txt
          python --version 2>&1 | Add-Content evidence/metadata.txt
          python -m pip freeze | Set-Content evidence/dependencies.txt
      - name: Reproducible virtual mission regression gate
        shell: pwsh
        run: |
          python scripts/verify_virtual_mission.py > evidence/verify.log 2>&1
          $status = $LASTEXITCODE
          Get-Content evidence/verify.log
          if ($status -ne 0) { exit $status }
      - name: Upload offline evidence (not flight proof)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vtol-autonomy-offline-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
